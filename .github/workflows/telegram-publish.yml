name: Publish Bundles to Telegram

on:
    workflow_call:
        inputs:
            tag:
                description: 'Release tag to publish to Telegram'
                required: true
                type: string
    workflow_dispatch:
        inputs:
            tag:
                description: 'Release tag to publish to Telegram'
                required: true
                type: string

jobs:
    publish:
        name: Publish to Telegram
        runs-on: ubuntu-latest

        steps:
            - name: Download release bundles and notes
              shell: bash
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ inputs.tag }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  mkdir -p release-assets
                  gh release download "$TAG" --repo "$REPO" --dir release-assets --pattern "*.nxb"
                  gh release view "$TAG" --repo "$REPO" --json body --jq '.body // ""' > release-notes.md

            - name: Send grouped bundles and changelog to Telegram
              shell: bash
              env:
                  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
                  TAG: ${{ inputs.tag }}
                  REPO: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
                    echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured; skipping Telegram publish."
                    exit 0
                  fi

                  python3 - <<'PY'
                  import glob, html, json, mimetypes, os, re, sys, urllib.error, urllib.parse, urllib.request, uuid

                  token = os.environ["TELEGRAM_BOT_TOKEN"]
                  chat_id = os.environ["TELEGRAM_CHAT_ID"]
                  tag = os.environ["TAG"]
                  repo = os.environ["REPO"]

                  notes = ""
                  if os.path.exists("release-notes.md"):
                      with open("release-notes.md", "r", encoding="utf-8") as f:
                          notes = f.read()

                  notes = re.sub(r"<!--.*?-->", "", notes, flags=re.S).strip()

                  def format_line(raw_line: str) -> str:
                      esc = html.escape(raw_line)
                      esc = re.sub(r"^\s*[-*]\s+", "• ", esc)
                      esc = re.sub(r"\*\*(.+?)\*\*", r"<b>\1</b>", esc)
                      esc = re.sub(r"`([^`]+)`", r"<code>\1</code>", esc)
                      return esc

                  sections = []
                  cur_title = None
                  cur_items = []
                  for raw in notes.splitlines():
                      s = raw.strip()
                      if not s:
                          continue
                      m_hdr = re.match(r"^#{1,6}\s+(.+)$", s)
                      m_top = re.match(r"^[-*]\s+\*\*(.+?)\*\*:?\s*$", s)
                      if m_hdr:
                          if cur_title is not None or cur_items:
                              sections.append((cur_title, cur_items))
                          cur_title = html.escape(m_hdr.group(1))
                          cur_items = []
                      elif m_top:
                          if cur_title is not None or cur_items:
                              sections.append((cur_title, cur_items))
                          cur_title = html.escape(m_top.group(1).rstrip(":"))
                          cur_items = []
                      else:
                          cur_items.append(format_line(s))
                  if cur_title is not None or cur_items:
                      sections.append((cur_title, cur_items))

                  blocks = []
                  for title, items in sections:
                      if title and items:
                          inner = "\n".join(items)
                          blocks.append(f"<b>{title}:</b>\n<blockquote expandable>{inner}</blockquote>")
                      elif title:
                          blocks.append(f"<b>{title}</b>")
                      elif items:
                          inner = "\n".join(items)
                          blocks.append(f"<blockquote expandable>{inner}</blockquote>")

                  body = "\n\n".join(blocks).strip()
                  header = f"🧩 <b>NexFusion Patches {html.escape(tag)} Released</b>"
                  footer = (
                      f"🔗 <a href=\"https://github.com/{repo}/releases/tag/{urllib.parse.quote(tag)}\">GitHub Release</a>\n"
                      f"📢 Channel: @nexfusion"
                  )
                  full_text = f"{header}\n\n{body}\n\n{footer}" if body else f"{header}\n\n{footer}"
                  use_separate_msg = len(full_text) > 1024
                  caption = f"{header}\n\n{footer}" if use_separate_msg else full_text

                  files = sorted(glob.glob("release-assets/*.nxb"))
                  if not files:
                      print("::error::No .nxb files found in release-assets/", file=sys.stderr)
                      sys.exit(1)

                  media = []
                  boundary = f"----NexFusionBoundary{uuid.uuid4().hex}"
                  parts = []

                  for idx, path in enumerate(files):
                      field = f"file{idx}"
                      item = {"type": "document", "media": f"attach://{field}"}
                      if idx == len(files) - 1:
                          item["caption"] = caption
                          item["parse_mode"] = "HTML"
                      media.append(item)

                  for k, v in [("chat_id", chat_id), ("media", json.dumps(media))]:
                      parts.append(f"--{boundary}\r\nContent-Disposition: form-data; name=\"{k}\"\r\n\r\n{v}\r\n".encode("utf-8"))

                  for idx, path in enumerate(files):
                      field = f"file{idx}"
                      filename = os.path.basename(path)
                      ctype = mimetypes.guess_type(filename)[0] or "application/octet-stream"
                      with open(path, "rb") as f:
                          file_bytes = f.read()
                      parts.append(
                          f"--{boundary}\r\nContent-Disposition: form-data; name=\"{field}\"; filename=\"{filename}\"\r\nContent-Type: {ctype}\r\n\r\n".encode("utf-8")
                          + file_bytes
                          + b"\r\n"
                      )

                  parts.append(f"--{boundary}--\r\n".encode("utf-8"))
                  body_bytes = b"".join(parts)

                  req = urllib.request.Request(
                      f"https://api.telegram.org/bot{token}/sendMediaGroup",
                      data=body_bytes,
                      headers={"Content-Type": f"multipart/form-data; boundary={boundary}"},
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=180) as resp:
                          res_data = json.loads(resp.read().decode("utf-8"))
                          print("sendMediaGroup ok:", len(res_data.get("result", [])))
                  except urllib.error.HTTPError as e:
                      print("Telegram sendMediaGroup failed:", e.code, e.read().decode("utf-8", errors="replace"), file=sys.stderr)
                      raise

                  if use_separate_msg:
                      msg_text = full_text
                      if len(msg_text) > 4096:
                          kept_blocks = []
                          max_b = 4096 - len(header) - len(footer) - 20
                          cur_b = 0
                          for blk in blocks:
                              add_b = len(blk) + (2 if kept_blocks else 0)
                              if cur_b + add_b > max_b:
                                  break
                              kept_blocks.append(blk)
                              cur_b += add_b
                          msg_text = f"{header}\n\n" + "\n\n".join(kept_blocks) + f"\n…\n\n{footer}"
                      reply_id = res_data.get("result", [{}])[0].get("message_id")
                      payload = {
                          "chat_id": chat_id,
                          "text": msg_text,
                          "parse_mode": "HTML",
                          "link_preview_options": {"is_disabled": True},
                      }
                      if reply_id:
                          payload["reply_parameters"] = {"message_id": reply_id}
                      msg_req = urllib.request.Request(
                          f"https://api.telegram.org/bot{token}/sendMessage",
                          data=json.dumps(payload).encode("utf-8"),
                          headers={"Content-Type": "application/json"},
                      )
                      try:
                          with urllib.request.urlopen(msg_req, timeout=60) as mresp:
                              print("sendMessage ok:", json.loads(mresp.read().decode("utf-8")).get("ok"))
                      except urllib.error.HTTPError as e:
                          print("Telegram sendMessage failed:", e.code, e.read().decode("utf-8", errors="replace"), file=sys.stderr)
                          raise
                  PY
